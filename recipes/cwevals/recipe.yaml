context:
  version: "0.0.1b1"

package:
  name: cwevals
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/c/cwevals/cwevals-${{ version }}.tar.gz
    sha256: 2ae997369ff44941925e4db1bd07eb4e13c05de412e615636fd12881d63f8a13
  - url: https://raw.githubusercontent.com/Rapptz/RoboDanny/1cb350899b1aaab7f6445d0180f9f878b02d0a33/LICENSE.txt
    sha256: 1f256ecad192880510e84ad60474eab7589218784b9a50bc7ceee34c2b91f1d5
    file_name: LICENSE-RoboDanny.txt

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >=${{ python_min }}
    - anyio >=3.5.0,<5
    - distro >=1.7.0,<2
    - httpx >=0.23.0,<1
    - pydantic >=1.9.0,<3
    - sniffio
    - typing_extensions >=4.14,<5

tests:
  - python:
      imports:
        - coreweave_evaluations
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The official Python library for the CoreWeave Evaluations API
  license: Apache-2.0 AND BSD-3-Clause AND MIT AND MPL-2.0
  license_file:
    - LICENSE
    - THIRD_PARTY_LICENSES.txt
    - LICENSE-RoboDanny.txt
  homepage: https://pypi.org/project/cwevals/

extra:
  recipe-maintainers:
    - dmitryduev
